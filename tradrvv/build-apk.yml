name: Build Traductor.AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias web
        run: npm install

      - name: Instalar plataforma Android
        run: npm install @capacitor/android@^7.4.3

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar archivos web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: TraductorAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
